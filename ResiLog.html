<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ResiLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #F6F5F1; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  @keyframes toastIn { from { opacity:0; transform: translate(-50%,8px);} to {opacity:1; transform: translate(-50%,0);} }
  @keyframes fadeSlide { from {opacity:0; transform: translateY(8px);} to {opacity:1; transform: translateY(0);} }
  @keyframes popIn { from {opacity:0; transform: scale(0.9);} to {opacity:1; transform: scale(1);} }
  button:focus-visible, input:focus-visible { outline: 2px solid #FF6A34; outline-offset: 2px; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root">
  <div id="fallback-msg" style="display:none; padding:40px 24px; text-align:center; font-family:-apple-system,sans-serif; color:#5B6870;">
    <div style="font-weight:700; font-size:16px; color:#182228; margin-bottom:8px;">ResiLog gagal dimuat</div>
    <div style="font-size:14px;">Periksa koneksi internet Anda, lalu muat ulang halaman. Jika masih gagal, pastikan tidak ada pemblokir iklan/skrip yang menghalangi cdnjs.cloudflare.com.</div>
  </div>
</div>
<script>
  window.addEventListener("load", function () {
    setTimeout(function () {
      if (!window.React || !window.ReactDOM || !window.Babel || !window.XLSX) {
        document.getElementById("fallback-msg").style.display = "block";
      }
    }, 4000);
  });
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ---------- design tokens ----------
const COLOR = {
  bg: "#F6F5F1",
  surface: "#FFFFFF",
  ink: "#182228",
  inkSoft: "#5B6870",
  accent: "#FF6A34",
  accentSoft: "#FFE7DA",
  success: "#2F9E44",
  successSoft: "#E4F6E8",
  danger: "#E0342F",
  dangerSoft: "#FBE3E2",
  warn: "#B8790A",
  warnSoft: "#FCEFD8",
  border: "#E7E3DB",
};

const FONT_UI = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
const FONT_MONO = "'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace";

const STATUS_LIST = ["Cancel", "Double Order", "Ekspedisi Lain", "Salah Input", "Lainnya"];
const FILTERS = [
  { key: "Semua", label: "Semua" },
  { key: "Cancel", label: "Cancel" },
  { key: "Double Order", label: "Double" },
  { key: "Ekspedisi Lain", label: "Ekspedisi Lain" },
];
const BARCODE_FORMATS = [
  "code_128","code_39","code_93","ean_13","ean_8","upc_a","upc_e","itf","qr_code",
];
const STORAGE_KEY = "resilog_records_v1";

// ---------- helpers ----------
function pad(n) { return String(n).padStart(2, "0"); }
function tanggalStr(d) { return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; }
function tanggalLong(d) {
  const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  return `${d.getDate()} ${bulan[d.getMonth()]} ${d.getFullYear()}`;
}
function jamStr(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function genId() { return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`; }
function filenameToday() {
  const d = new Date();
  return `ResiLog_${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()}.xlsx`;
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---------- local storage (persistent, works on any standard web host) ----------
function loadRecords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}
function saveRecords(records) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    return true;
  } catch (e) { return false; }
}

// ---------- minimal inline icon set (no external icon library needed) ----------
function Icon({ name, size = 20, color = "currentColor", strokeWidth = 2, style }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth, strokeLinecap: "round", strokeLinejoin: "round", style };
  switch (name) {
    case "scan": return <svg {...common}><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>;
    case "camera": return <svg {...common}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>;
    case "keyboard": return <svg {...common}><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="6" y1="9" x2="6.01" y2="9"/><line x1="10" y1="9" x2="10.01" y2="9"/><line x1="14" y1="9" x2="14.01" y2="9"/><line x1="18" y1="9" x2="18.01" y2="9"/><line x1="8" y1="17" x2="16" y2="17"/></svg>;
    case "chevronLeft": return <svg {...common}><polyline points="15 18 9 12 15 6"/></svg>;
    case "search": return <svg {...common}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    case "check": return <svg {...common}><polyline points="20 6 9 17 4 12"/></svg>;
    case "x": return <svg {...common}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    case "trash": return <svg {...common}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    case "pencil": return <svg {...common}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>;
    case "sheet": return <svg {...common}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><line x1="8" y1="13" x2="8" y2="17"/></svg>;
    case "message": return <svg {...common}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>;
    case "zap": return <svg {...common}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>;
    case "zapOff": return <svg {...common}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" opacity="0.55"/><line x1="2" y1="2" x2="22" y2="22"/></svg>;
    case "package": return <svg {...common}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>;
    case "alert": return <svg {...common}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
    default: return null;
  }
}

// ---------- small UI atoms ----------
function BigButton({ children, onClick, color = COLOR.ink, disabled, style, icon }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{
        width: "100%", padding: "18px 20px", borderRadius: 16, border: "none",
        background: disabled ? "#D8D4CB" : color, color: "#FFFFFF", fontFamily: FONT_UI,
        fontWeight: 600, fontSize: 17, display: "flex", alignItems: "center", justifyContent: "center",
        gap: 10, cursor: disabled ? "not-allowed" : "pointer",
        transition: "transform 120ms ease, opacity 120ms ease", ...style,
      }}
      onPointerDown={(e) => { if (!disabled) e.currentTarget.style.transform = "scale(0.98)"; }}
      onPointerUp={(e) => { e.currentTarget.style.transform = "scale(1)"; }}
      onPointerLeave={(e) => { e.currentTarget.style.transform = "scale(1)"; }}
    >
      {icon}{children}
    </button>
  );
}

function StatusChip({ status }) {
  const map = {
    Cancel: { bg: COLOR.dangerSoft, fg: COLOR.danger },
    "Double Order": { bg: COLOR.warnSoft, fg: COLOR.warn },
    "Ekspedisi Lain": { bg: COLOR.accentSoft, fg: COLOR.accent },
    "Salah Input": { bg: "#E7E9FB", fg: "#3B4BC7" },
    Lainnya: { bg: "#EAEAEA", fg: COLOR.inkSoft },
  };
  const c = map[status] || map["Lainnya"];
  return (
    <span style={{ background: c.bg, color: c.fg, fontFamily: FONT_UI, fontSize: 12, fontWeight: 600, padding: "4px 10px", borderRadius: 999, whiteSpace: "nowrap" }}>
      {status}
    </span>
  );
}

function Toast({ toast }) {
  if (!toast) return null;
  const colors = { success: { bg: COLOR.ink, fg: "#fff" }, warn: { bg: COLOR.warn, fg: "#fff" }, danger: { bg: COLOR.danger, fg: "#fff" } };
  const c = colors[toast.type] || colors.success;
  return (
    <div style={{ position: "fixed", left: "50%", bottom: 96, transform: "translateX(-50%)", background: c.bg, color: c.fg, padding: "12px 20px", borderRadius: 12, fontFamily: FONT_UI, fontSize: 14, fontWeight: 500, boxShadow: "0 8px 24px rgba(0,0,0,0.18)", zIndex: 200, animation: "toastIn 200ms ease", maxWidth: "88%", textAlign: "center" }}>
      {toast.message}
    </div>
  );
}

function Header({ title, onBack, right }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 16px 12px", position: "sticky", top: 0, background: COLOR.bg, zIndex: 10 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 32 }}>
        {onBack && (
          <button onClick={onBack} style={{ background: "none", border: "none", padding: 4, cursor: "pointer", color: COLOR.ink }}>
            <Icon name="chevronLeft" size={24} />
          </button>
        )}
      </div>
      <div style={{ fontFamily: FONT_UI, fontWeight: 700, fontSize: 16, color: COLOR.ink }}>{title}</div>
      <div style={{ minWidth: 32, display: "flex", justifyContent: "flex-end" }}>{right}</div>
    </div>
  );
}

function BottomNav({ active, onChange }) {
  const items = [
    { key: "scan", label: "Scan", icon: "scan" },
    { key: "history", label: "Riwayat", icon: "package" },
    { key: "data", label: "Data", icon: "sheet" },
  ];
  return (
    <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, display: "flex", background: COLOR.surface, borderTop: `1px solid ${COLOR.border}`, paddingBottom: "env(safe-area-inset-bottom, 0px)", zIndex: 50 }}>
      {items.map((it) => {
        const isActive = active === it.key;
        return (
          <button key={it.key} onClick={() => onChange(it.key)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "10px 0 8px", background: "none", border: "none", cursor: "pointer", color: isActive ? COLOR.accent : COLOR.inkSoft }}>
            <Icon name={it.icon} size={22} strokeWidth={isActive ? 2.4 : 2} />
            <span style={{ fontFamily: FONT_UI, fontSize: 11, fontWeight: isActive ? 700 : 500 }}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

// ---------- main app ----------
function ResiLogApp() {
  const [records, setRecords] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("scan");
  const [view, setView] = useState("idle");
  const [toast, setToast] = useState(null);
  const [currentResi, setCurrentResi] = useState(null);
  const [selectedStatus, setSelectedStatus] = useState(null);
  const [duplicateInfo, setDuplicateInfo] = useState(null);
  const [pendingResi, setPendingResi] = useState(null);
  const [cameraError, setCameraError] = useState(null);
  const [manualValue, setManualValue] = useState("");
  const [historySearch, setHistorySearch] = useState("");
  const [historyFilter, setHistoryFilter] = useState("Semua");
  const [detailRecord, setDetailRecord] = useState(null);
  const [editStatus, setEditStatus] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState([]);
  const [waMessage, setWaMessage] = useState("");
  const [torchOn, setTorchOn] = useState(false);
  const [torchAvailable, setTorchAvailable] = useState(false);

  const recordsRef = useRef([]);
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const scanIntervalRef = useRef(null);
  const processingRef = useRef(false);
  const toastTimerRef = useRef(null);

  useEffect(() => { recordsRef.current = records; }, [records]);

  useEffect(() => {
    setRecords(loadRecords());
    setLoaded(true);
  }, []);

  const persist = useCallback((next) => {
    setRecords(next);
    const ok = saveRecords(next);
    if (!ok) showToast("✕ Gagal menyimpan data", "danger");
  }, []);

  function showToast(message, type = "success") {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ message, type });
    toastTimerRef.current = setTimeout(() => setToast(null), 2200);
  }

  const stopCamera = useCallback(() => {
    if (scanIntervalRef.current) { clearInterval(scanIntervalRef.current); scanIntervalRef.current = null; }
    if (streamRef.current) { streamRef.current.getTracks().forEach((t) => t.stop()); streamRef.current = null; }
    setTorchAvailable(false); setTorchOn(false);
  }, []);

  const startCamera = useCallback(async () => {
    setCameraError(null);
    processingRef.current = false;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
      streamRef.current = stream;
      if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play().catch(() => {}); }
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      setTorchAvailable(!!caps.torch);

      if (!("BarcodeDetector" in window)) { setCameraError("nodetector"); return; }
      const detector = new window.BarcodeDetector({ formats: BARCODE_FORMATS });
      scanIntervalRef.current = setInterval(async () => {
        if (processingRef.current || !videoRef.current) return;
        try {
          const codes = await detector.detect(videoRef.current);
          if (codes && codes.length > 0 && codes[0].rawValue) {
            processingRef.current = true;
            handleDetected(codes[0].rawValue.trim());
          }
        } catch (e) {}
      }, 350);
    } catch (e) { setCameraError("permission"); }
  }, []);

  useEffect(() => {
    if (view === "camera") startCamera(); else stopCamera();
    return () => stopCamera();
  }, [view, startCamera, stopCamera]);

  function toggleTorch() {
    const stream = streamRef.current;
    if (!stream) return;
    const track = stream.getVideoTracks()[0];
    const next = !torchOn;
    track.applyConstraints({ advanced: [{ torch: next }] }).then(() => setTorchOn(next)).catch(() => {});
  }

  function handleDetected(code) { stopCamera(); evaluateResi(code); }

  function evaluateResi(resiNumber) {
    const today = tanggalStr(new Date());
    const dup = recordsRef.current.find((r) => r.resi.toLowerCase() === resiNumber.toLowerCase() && r.tanggal === today);
    setCurrentResi(resiNumber);
    setSelectedStatus(null);
    if (dup) { setDuplicateInfo({ status: dup.status, jam: dup.jam }); setPendingResi(resiNumber); setView("duplicate"); }
    else { setDuplicateInfo(null); setView("result"); }
  }

  function handleManualSubmit() {
    const v = manualValue.trim();
    if (!v) return;
    setManualValue("");
    evaluateResi(v);
  }

  function saveCurrentResi() {
    if (!currentResi || !selectedStatus) return;
    const now = new Date();
    const rec = { id: genId(), resi: currentResi, status: selectedStatus, tanggal: tanggalStr(now), jam: jamStr(now), createdAt: now.toISOString() };
    const next = [rec, ...recordsRef.current];
    persist(next);
    showToast("✓ Resi berhasil disimpan", "success");
    setCurrentResi(null); setSelectedStatus(null); setDuplicateInfo(null);
    setTab("scan");
    setTimeout(() => setView("camera"), 500);
  }

  function cancelToIdle() {
    stopCamera();
    setCurrentResi(null); setSelectedStatus(null); setDuplicateInfo(null);
    setView("idle");
  }

  const today = tanggalStr(new Date());
  const totalToday = records.filter((r) => r.tanggal === today).length;
  const cancelToday = records.filter((r) => r.tanggal === today && r.status === "Cancel").length;
  const doubleToday = records.filter((r) => r.tanggal === today && r.status === "Double Order").length;

  const filteredHistory = records.filter((r) => {
    const matchSearch = r.resi.toLowerCase().includes(historySearch.trim().toLowerCase());
    const matchFilter = historyFilter === "Semua" || r.status === historyFilter;
    return matchSearch && matchFilter;
  });

  function groupByDate(list) {
    const groups = {};
    list.forEach((r) => { if (!groups[r.tanggal]) groups[r.tanggal] = []; groups[r.tanggal].push(r); });
    return groups;
  }
  const grouped = groupByDate(filteredHistory);

  function openDetail(rec) { setDetailRecord(rec); setEditStatus(null); setConfirmDelete(false); setView("detail"); }
  function saveEditStatus() {
    if (!editStatus || !detailRecord) return;
    const next = records.map((r) => (r.id === detailRecord.id ? { ...r, status: editStatus } : r));
    persist(next);
    setDetailRecord({ ...detailRecord, status: editStatus });
    setEditStatus(null);
    showToast("✓ Status diperbarui", "success");
  }
  function deleteRecord() {
    const next = records.filter((r) => r.id !== detailRecord.id);
    persist(next);
    showToast("✓ Resi dihapus", "success");
    setConfirmDelete(false); setView("history"); setTab("history");
  }

  function exportExcel(scope) {
    const data = scope === "today" ? records.filter((r) => r.tanggal === today) : records;
    if (data.length === 0) { showToast("✕ Tidak ada data untuk diekspor", "danger"); return; }
    const rows = [["No", "Nomor Resi", "Status", "Tanggal", "Jam"]];
    data.forEach((r, i) => rows.push([i + 1, r.resi, r.status, r.tanggal, r.jam]));
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{ wch: 5 }, { wch: 18 }, { wch: 16 }, { wch: 12 }, { wch: 8 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "ResiLog");
    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    downloadBlob(new Blob([out], { type: "application/octet-stream" }), filenameToday());
    showToast("✓ Excel berhasil dibuat", "success");
  }

  function enterSelectMode() { setSelectedIds([]); setSelectMode(true); setTab("history"); setView("history"); }
  function toggleSelect(id) { setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id])); }
  function buildWaMessage() {
    const selected = records.filter((r) => selectedIds.includes(r.id));
    const counts = {};
    selected.forEach((r) => { counts[r.status] = (counts[r.status] || 0) + 1; });
    const lines = [];
    lines.push("REKAP RESI BERMASALAH");
    lines.push(tanggalLong(new Date()));
    lines.push("");
    Object.keys(counts).forEach((k) => lines.push(`${k}: ${counts[k]}`));
    lines.push("");
    lines.push("Detail:");
    selected.forEach((r, i) => lines.push(`${i + 1}. ${r.resi} — ${r.status}`));
    return lines.join("\n");
  }
  function generateWa() {
    if (selectedIds.length === 0) return;
    setWaMessage(buildWaMessage());
    setSelectMode(false);
    setView("wa-preview");
  }
  function sendWhatsapp() {
    const url = `https://wa.me/?text=${encodeURIComponent(waMessage)}`;
    window.open(url, "_blank");
  }

  function switchTab(t) {
    setSelectMode(false);
    setTab(t);
    if (t === "scan") setView("idle");
    if (t === "history") setView("history");
    if (t === "data") setView("data");
  }

  const showBottomNav = !["camera", "result", "duplicate", "detail", "wa-preview", "manual"].includes(view);

  return (
    <div style={{ fontFamily: FONT_UI, background: COLOR.bg, minHeight: "100vh", maxWidth: 480, margin: "0 auto", color: COLOR.ink, position: "relative", paddingBottom: showBottomNav ? 84 : 0 }}>
      {!loaded ? (
        <div style={{ padding: 40, textAlign: "center", color: COLOR.inkSoft }}>Memuat…</div>
      ) : (
        <React.Fragment>
          {tab === "scan" && view === "idle" && (
            <ScanIdle totalToday={totalToday} cancelToday={cancelToday} doubleToday={doubleToday} onScan={() => setView("camera")} onManual={() => setView("manual")} />
          )}
          {view === "camera" && (
            <CameraView videoRef={videoRef} cameraError={cameraError} torchAvailable={torchAvailable} torchOn={torchOn} onToggleTorch={toggleTorch} onClose={cancelToIdle} onManual={() => { stopCamera(); setView("manual"); }} />
          )}
          {view === "manual" && (
            <ManualInput value={manualValue} onChange={setManualValue} onSubmit={handleManualSubmit} onBack={() => setView(tab === "scan" ? "idle" : view)} />
          )}
          {view === "duplicate" && duplicateInfo && (
            <DuplicateWarning resi={pendingResi} info={duplicateInfo} onBack={cancelToIdle} onProceed={() => { setDuplicateInfo(null); setView("result"); }} />
          )}
          {view === "result" && currentResi && (
            <ResultView resi={currentResi} selectedStatus={selectedStatus} onSelectStatus={setSelectedStatus} onSave={saveCurrentResi} onBack={cancelToIdle} />
          )}
          {tab === "history" && view === "history" && (
            <HistoryView grouped={grouped} search={historySearch} onSearch={setHistorySearch} filter={historyFilter} onFilter={setHistoryFilter} onOpen={openDetail} selectMode={selectMode} selectedIds={selectedIds} onToggleSelect={toggleSelect} onExitSelect={() => setSelectMode(false)} onGenerateWa={generateWa} isEmpty={records.length === 0} />
          )}
          {view === "detail" && detailRecord && (
            <DetailView record={detailRecord} editStatus={editStatus} onEditStatus={setEditStatus} onSaveEdit={saveEditStatus} confirmDelete={confirmDelete} onAskDelete={() => setConfirmDelete(true)} onCancelDelete={() => setConfirmDelete(false)} onDelete={deleteRecord} onBack={() => { setView("history"); setTab("history"); }} />
          )}
          {tab === "data" && view === "data" && (
            <DataView total={records.length} totalToday={totalToday} onExport={exportExcel} onGenerateWa={enterSelectMode} />
          )}
          {view === "wa-preview" && (
            <WaPreview message={waMessage} onBack={() => { setView("history"); setTab("history"); setSelectMode(true); }} onSend={sendWhatsapp} />
          )}
        </React.Fragment>
      )}
      <Toast toast={toast} />
      {showBottomNav && <BottomNav active={tab} onChange={switchTab} />}
    </div>
  );
}

function ScanIdle({ totalToday, cancelToday, doubleToday, onScan, onManual }) {
  return (
    <div style={{ padding: "28px 20px 20px", animation: "fadeSlide 220ms ease" }}>
      <div style={{ marginBottom: 28 }}>
        <div style={{ fontFamily: FONT_UI, fontWeight: 800, fontSize: 26, letterSpacing: -0.5 }}>ResiLog</div>
        <div style={{ color: COLOR.inkSoft, fontSize: 14, marginTop: 2 }}>Catat resi bermasalah dengan cepat</div>
      </div>
      <div style={{ display: "flex", gap: 10, marginBottom: 32 }}>
        <StatCard label="Total Hari Ini" value={totalToday} />
        <StatCard label="Cancel" value={cancelToday} accent={COLOR.danger} />
        <StatCard label="Double" value={doubleToday} accent={COLOR.warn} />
      </div>
      <BigButton onClick={onScan} color={COLOR.accent} icon={<Icon name="scan" size={22} color="#fff" />} style={{ padding: "26px 20px", fontSize: 19, borderRadius: 20, boxShadow: `0 10px 24px ${COLOR.accentSoft}` }}>
        SCAN RESI
      </BigButton>
      <button onClick={onManual} style={{ width: "100%", marginTop: 16, background: "none", border: "none", color: COLOR.inkSoft, fontFamily: FONT_UI, fontSize: 14, fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, padding: 10, cursor: "pointer" }}>
        <Icon name="keyboard" size={16} /> Input Manual
      </button>
    </div>
  );
}

function StatCard({ label, value, accent }) {
  return (
    <div style={{ flex: 1, background: COLOR.surface, borderRadius: 14, padding: "14px 12px", border: `1px solid ${COLOR.border}` }}>
      <div style={{ fontSize: 22, fontWeight: 800, color: accent || COLOR.ink, fontFamily: FONT_MONO }}>{value}</div>
      <div style={{ fontSize: 11.5, color: COLOR.inkSoft, marginTop: 2, fontWeight: 500 }}>{label}</div>
    </div>
  );
}

function CameraView({ videoRef, cameraError, torchAvailable, torchOn, onToggleTorch, onClose, onManual }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "#000", zIndex: 100 }}>
      <video ref={videoRef} playsInline muted style={{ width: "100%", height: "100%", objectFit: "cover" }} />
      {!cameraError && (
        <div style={{ position: "absolute", top: "38%", left: "10%", right: "10%", height: 110, border: `2px solid ${COLOR.accent}`, borderRadius: 12, boxShadow: "0 0 0 2000px rgba(0,0,0,0.35)" }} />
      )}
      <div style={{ position: "absolute", top: 0, left: 0, right: 0, padding: "16px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <button onClick={onClose} style={{ background: "rgba(0,0,0,0.5)", border: "none", borderRadius: 999, width: 40, height: 40, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", cursor: "pointer" }}>
          <Icon name="x" size={20} color="#fff" />
        </button>
        {torchAvailable && (
          <button onClick={onToggleTorch} style={{ background: torchOn ? COLOR.accent : "rgba(0,0,0,0.5)", border: "none", borderRadius: 999, width: 40, height: 40, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", cursor: "pointer" }}>
            <Icon name={torchOn ? "zap" : "zapOff"} size={19} color="#fff" />
          </button>
        )}
      </div>
      <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "20px 20px calc(28px + env(safe-area-inset-bottom,0px))", textAlign: "center" }}>
        {cameraError === "permission" && (
          <div style={{ color: "#fff", fontFamily: FONT_UI, fontSize: 14, marginBottom: 14 }}>Tidak dapat mengakses kamera. Periksa izin kamera di browser Anda.</div>
        )}
        {cameraError === "nodetector" && (
          <div style={{ color: "#fff", fontFamily: FONT_UI, fontSize: 14, marginBottom: 14 }}>Scanner otomatis tidak didukung di browser ini.</div>
        )}
        {!cameraError && (
          <div style={{ color: "rgba(255,255,255,0.85)", fontFamily: FONT_UI, fontSize: 13, marginBottom: 14 }}>Arahkan kamera ke barcode resi</div>
        )}
        <button onClick={onManual} style={{ background: "rgba(255,255,255,0.14)", border: "1px solid rgba(255,255,255,0.4)", color: "#fff", borderRadius: 14, padding: "12px 20px", fontFamily: FONT_UI, fontWeight: 600, fontSize: 14, display: "inline-flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
          <Icon name="keyboard" size={16} color="#fff" /> Input Manual
        </button>
      </div>
    </div>
  );
}

function ManualInput({ value, onChange, onSubmit, onBack }) {
  return (
    <div style={{ animation: "fadeSlide 200ms ease" }}>
      <Header title="Input Manual" onBack={onBack} />
      <div style={{ padding: "8px 20px 20px" }}>
        <div style={{ fontSize: 13, color: COLOR.inkSoft, marginBottom: 10 }}>Masukkan nomor resi secara manual</div>
        <input autoFocus value={value} onChange={(e) => onChange(e.target.value)} onKeyDown={(e) => e.key === "Enter" && onSubmit()} placeholder="Contoh: JX123456789"
          style={{ width: "100%", padding: "16px 16px", borderRadius: 14, border: `1.5px solid ${COLOR.border}`, fontFamily: FONT_MONO, fontSize: 16, marginBottom: 18, background: COLOR.surface }} />
        <BigButton onClick={onSubmit} color={COLOR.accent} disabled={!value.trim()}>Lanjutkan</BigButton>
      </div>
    </div>
  );
}

function DuplicateWarning({ resi, info, onBack, onProceed }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(24,34,40,0.55)", zIndex: 110, display: "flex", alignItems: "flex-end" }}>
      <div style={{ width: "100%", maxWidth: 480, margin: "0 auto", background: COLOR.surface, borderRadius: "20px 20px 0 0", padding: "24px 20px calc(24px + env(safe-area-inset-bottom,0px))", animation: "popIn 200ms ease" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
          <div style={{ background: COLOR.warnSoft, borderRadius: 999, padding: 8 }}><Icon name="alert" size={20} color={COLOR.warn} /></div>
          <div style={{ fontWeight: 700, fontSize: 16 }}>Resi sudah tercatat</div>
        </div>
        <div style={{ background: COLOR.bg, borderRadius: 14, padding: 16, marginBottom: 20 }}>
          <div style={{ fontFamily: FONT_MONO, fontSize: 15, fontWeight: 600, marginBottom: 10 }}>{resi}</div>
          <Row label="Status sebelumnya" value={<StatusChip status={info.status} />} />
          <Row label="Waktu pencatatan" value={info.jam} />
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <BigButton onClick={onBack} color={COLOR.ink} style={{ flex: 1, padding: 15 }}>Kembali</BigButton>
          <BigButton onClick={onProceed} color={COLOR.accent} style={{ flex: 1, padding: 15 }}>Tetap Simpan</BigButton>
        </div>
      </div>
    </div>
  );
}

function Row({ label, value }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0" }}>
      <span style={{ fontSize: 13, color: COLOR.inkSoft }}>{label}</span>
      <span style={{ fontSize: 14, fontWeight: 600 }}>{value}</span>
    </div>
  );
}

function ResultView({ resi, selectedStatus, onSelectStatus, onSave, onBack }) {
  return (
    <div style={{ animation: "fadeSlide 200ms ease" }}>
      <Header title="Resi Ditemukan" onBack={onBack} />
      <div style={{ padding: "4px 20px 24px" }}>
        <div style={{ background: COLOR.surface, border: `1px solid ${COLOR.border}`, borderRadius: 16, padding: "18px 18px", textAlign: "center", marginBottom: 26 }}>
          <Icon name="package" size={22} color={COLOR.accent} style={{ marginBottom: 8 }} />
          <div style={{ fontFamily: FONT_MONO, fontWeight: 600, fontSize: 19, letterSpacing: 0.3 }}>{resi}</div>
        </div>
        <div style={{ fontSize: 13, color: COLOR.inkSoft, fontWeight: 600, marginBottom: 12 }}>Pilih alasan</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
          {STATUS_LIST.map((s) => {
            const active = selectedStatus === s;
            return (
              <button key={s} onClick={() => onSelectStatus(s)} style={{ width: "100%", textAlign: "left", padding: "16px 18px", borderRadius: 14, border: active ? `2px solid ${COLOR.accent}` : `1.5px solid ${COLOR.border}`, background: active ? COLOR.accentSoft : COLOR.surface, fontFamily: FONT_UI, fontWeight: 600, fontSize: 15.5, color: active ? COLOR.accent : COLOR.ink, cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                {s}{active && <Icon name="check" size={18} color={COLOR.accent} />}
              </button>
            );
          })}
        </div>
        <BigButton onClick={onSave} color={COLOR.accent} disabled={!selectedStatus}>SIMPAN RESI</BigButton>
      </div>
    </div>
  );
}

function HistoryView({ grouped, search, onSearch, filter, onFilter, onOpen, selectMode, selectedIds, onToggleSelect, onExitSelect, onGenerateWa, isEmpty }) {
  const dates = Object.keys(grouped);
  const todayLabel = tanggalStr(new Date());
  return (
    <div style={{ animation: "fadeSlide 200ms ease", paddingBottom: selectMode ? 90 : 0 }}>
      <div style={{ padding: "20px 20px 8px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div style={{ fontWeight: 800, fontSize: 20 }}>Riwayat</div>
        {selectMode && (
          <button onClick={onExitSelect} style={{ background: "none", border: "none", color: COLOR.inkSoft, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Batal</button>
        )}
      </div>
      <div style={{ padding: "4px 20px 12px" }}>
        <div style={{ position: "relative", marginBottom: 12 }}>
          <span style={{ position: "absolute", left: 14, top: 13 }}><Icon name="search" size={16} color={COLOR.inkSoft} /></span>
          <input value={search} onChange={(e) => onSearch(e.target.value)} placeholder="Cari nomor resi..."
            style={{ width: "100%", padding: "12px 14px 12px 38px", borderRadius: 12, border: `1.5px solid ${COLOR.border}`, fontFamily: FONT_UI, fontSize: 14, background: COLOR.surface }} />
        </div>
        <div style={{ display: "flex", gap: 8, overflowX: "auto" }}>
          {FILTERS.map((f) => {
            const active = filter === f.key;
            return (
              <button key={f.key} onClick={() => onFilter(f.key)} style={{ flexShrink: 0, padding: "8px 14px", borderRadius: 999, border: active ? `1.5px solid ${COLOR.ink}` : `1.5px solid ${COLOR.border}`, background: active ? COLOR.ink : COLOR.surface, color: active ? "#fff" : COLOR.ink, fontFamily: FONT_UI, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                {f.label}
              </button>
            );
          })}
        </div>
      </div>
      <div style={{ padding: "4px 20px 12px" }}>
        {isEmpty && (
          <div style={{ textAlign: "center", padding: "60px 20px", color: COLOR.inkSoft }}>
            <Icon name="package" size={32} color={COLOR.inkSoft} style={{ marginBottom: 10, opacity: 0.5 }} />
            <div style={{ fontSize: 14 }}>Belum ada resi tercatat</div>
          </div>
        )}
        {!isEmpty && dates.length === 0 && (
          <div style={{ textAlign: "center", padding: "40px 20px", color: COLOR.inkSoft, fontSize: 14 }}>Tidak ditemukan</div>
        )}
        {dates.map((date) => (
          <div key={date} style={{ marginBottom: 18 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: COLOR.inkSoft, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.4 }}>
              {date === todayLabel ? "Hari Ini" : date}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {grouped[date].map((r) => (
                <div key={r.id} onClick={() => (selectMode ? onToggleSelect(r.id) : onOpen(r))}
                  style={{ background: COLOR.surface, border: `1px solid ${COLOR.border}`, borderRadius: 14, padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
                    {selectMode && (
                      <div style={{ width: 20, height: 20, borderRadius: 6, border: `2px solid ${selectedIds.includes(r.id) ? COLOR.accent : COLOR.border}`, background: selectedIds.includes(r.id) ? COLOR.accent : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                        {selectedIds.includes(r.id) && <Icon name="check" size={13} color="#fff" />}
                      </div>
                    )}
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontFamily: FONT_MONO, fontWeight: 600, fontSize: 14.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.resi}</div>
                      <div style={{ marginTop: 5 }}><StatusChip status={r.status} /></div>
                    </div>
                  </div>
                  <div style={{ fontSize: 12.5, color: COLOR.inkSoft, flexShrink: 0, marginLeft: 10 }}>{r.jam}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
      {selectMode && (
        <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, maxWidth: 480, margin: "0 auto", background: COLOR.surface, borderTop: `1px solid ${COLOR.border}`, padding: "12px 20px calc(12px + env(safe-area-inset-bottom,0px))", zIndex: 60 }}>
          <BigButton onClick={onGenerateWa} color={COLOR.accent} disabled={selectedIds.length === 0}>
            GENERATE WHATSAPP {selectedIds.length > 0 ? `(${selectedIds.length})` : ""}
          </BigButton>
        </div>
      )}
    </div>
  );
}

function DetailView({ record, editStatus, onEditStatus, onSaveEdit, confirmDelete, onAskDelete, onCancelDelete, onDelete, onBack }) {
  const dateObj = (() => { const [d, m, y] = record.tanggal.split("/").map(Number); return new Date(y, m - 1, d); })();
  return (
    <div style={{ animation: "fadeSlide 200ms ease" }}>
      <Header title="Detail Resi" onBack={onBack} />
      <div style={{ padding: "4px 20px 24px" }}>
        <div style={{ textAlign: "center", padding: "22px 0 26px" }}>
          <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 22 }}>{record.resi}</div>
        </div>
        <div style={{ background: COLOR.surface, border: `1px solid ${COLOR.border}`, borderRadius: 16, padding: 18, marginBottom: 20 }}>
          <FieldRow label="Status" value={editStatus ? undefined : <StatusChip status={record.status} />} />
          {editStatus && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 6, marginBottom: 6 }}>
              {STATUS_LIST.map((s) => (
                <button key={s} onClick={() => onEditStatus(s)} style={{ textAlign: "left", padding: "12px 14px", borderRadius: 10, border: editStatus === s ? `2px solid ${COLOR.accent}` : `1.5px solid ${COLOR.border}`, background: editStatus === s ? COLOR.accentSoft : COLOR.surface, fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
                  {s}
                </button>
              ))}
            </div>
          )}
          <div style={{ height: 1, background: COLOR.border, margin: "10px 0" }} />
          <FieldRow label="Tanggal" value={tanggalLong(dateObj)} />
          <div style={{ height: 1, background: COLOR.border, margin: "10px 0" }} />
          <FieldRow label="Jam" value={record.jam} />
        </div>
        {editStatus ? (
          <BigButton onClick={onSaveEdit} color={COLOR.accent} disabled={editStatus === record.status}>Simpan Perubahan</BigButton>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <BigButton onClick={() => onEditStatus(record.status)} color={COLOR.ink} icon={<Icon name="pencil" size={17} color="#fff" />}>Edit Status</BigButton>
            <BigButton onClick={onAskDelete} color={COLOR.danger} icon={<Icon name="trash" size={17} color="#fff" />}>Hapus</BigButton>
          </div>
        )}
      </div>
      {confirmDelete && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(24,34,40,0.55)", zIndex: 110, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ background: COLOR.surface, borderRadius: 18, padding: 22, width: "100%", maxWidth: 340, animation: "popIn 180ms ease" }}>
            <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 18, textAlign: "center" }}>Hapus resi ini?</div>
            <div style={{ display: "flex", gap: 10 }}>
              <BigButton onClick={onCancelDelete} color={COLOR.ink} style={{ flex: 1, padding: 13 }}>Batal</BigButton>
              <BigButton onClick={onDelete} color={COLOR.danger} style={{ flex: 1, padding: 13 }}>Hapus</BigButton>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function FieldRow({ label, value }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0" }}>
      <span style={{ fontSize: 13, color: COLOR.inkSoft }}>{label}</span>
      <span style={{ fontSize: 15, fontWeight: 600 }}>{value}</span>
    </div>
  );
}

function DataView({ total, totalToday, onExport, onGenerateWa }) {
  return (
    <div style={{ padding: "20px 20px 24px", animation: "fadeSlide 200ms ease" }}>
      <div style={{ fontWeight: 800, fontSize: 20, marginBottom: 20 }}>Data</div>
      <div style={{ display: "flex", gap: 10, marginBottom: 26 }}>
        <StatCard label="Total Data" value={total} />
        <StatCard label="Hari Ini" value={totalToday} accent={COLOR.accent} />
      </div>
      <div style={{ fontSize: 13, color: COLOR.inkSoft, fontWeight: 600, marginBottom: 10 }}>Export Excel</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 26 }}>
        <BigButton onClick={() => onExport("today")} color={COLOR.ink} icon={<Icon name="sheet" size={18} color="#fff" />}>Export Hari Ini</BigButton>
        <BigButton onClick={() => onExport("all")} color={COLOR.ink} icon={<Icon name="sheet" size={18} color="#fff" />}>Export Semua Data</BigButton>
      </div>
      <div style={{ fontSize: 13, color: COLOR.inkSoft, fontWeight: 600, marginBottom: 10 }}>Kirim Rekap</div>
      <BigButton onClick={onGenerateWa} color={COLOR.accent} icon={<Icon name="message" size={18} color="#fff" />}>GENERATE WHATSAPP</BigButton>
    </div>
  );
}

function WaPreview({ message, onBack, onSend }) {
  return (
    <div style={{ animation: "fadeSlide 200ms ease" }}>
      <Header title="Rekap WhatsApp" onBack={onBack} />
      <div style={{ padding: "4px 20px 24px" }}>
        <div style={{ background: COLOR.surface, border: `1px solid ${COLOR.border}`, borderRadius: 16, padding: 18, marginBottom: 20, whiteSpace: "pre-wrap", fontFamily: FONT_MONO, fontSize: 13.5, lineHeight: 1.6 }}>
          {message}
        </div>
        <BigButton onClick={onSend} color={COLOR.accent} icon={<Icon name="message" size={18} color="#fff" />}>KIRIM VIA WHATSAPP</BigButton>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ResiLogApp />);
</script>
</body>
</html>
