<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BTS Report Daily</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" id="pwa-icon">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f4f1;
  --surface:#ffffff;
  --surface2:#f0efe9;
  --border:#e4e2db;
  --border2:#d0cec5;
  --ink:#1a1917;
  --ink2:#5c5a54;
  --ink3:#9c9a92;
  --accent:#1a1917;
  --accent-soft:#e8e6e0;
  --cgkg:#0f4c3a;
  --cgkg-bg:#e8f5f0;
  --cgkg-mid:#c2e8db;
  --warn:#c2410c;
  --warn-bg:#fff7ed;
  --blue:#1e40af;
  --blue-bg:#eff6ff;
  --green:#15803d;
  --green-bg:#f0fdf4;
  --r:14px;
  --font:'DM Sans',sans-serif;
  --mono:'Space Mono',monospace
}

body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  padding-bottom:140px;
  min-height:100vh
}

/* ── DYNAMIC ISLAND ── */
.di-wrap{
  position:sticky;top:0;z-index:200;
  background:var(--bg);
  padding:10px 16px 6px;
  display:flex;justify-content:center
}
.di{
  background:var(--ink);
  border-radius:40px;
  padding:10px 20px;
  display:flex;align-items:center;gap:12px;
  width:100%;max-width:340px;
  box-shadow:0 8px 32px rgba(0,0,0,.25);
  position:relative;overflow:hidden
}
.di::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 60%);
  pointer-events:none
}
.di-icon{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0
}
.di-info{flex:1;overflow:hidden}
.di-title{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.di-sub{font-size:10px;color:rgba(255,255,255,.45);font-family:var(--mono)}
.di-pill{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;padding:3px 10px;
  font-size:10px;font-weight:600;color:rgba(255,255,255,.6);
  white-space:nowrap
}
.di-pill.ok{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#4ade80}

/* ── SECOND BAR ── */
.subbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px 10px;
  position:sticky;top:58px;z-index:190;
  background:var(--bg)
}
.subbar-date{font-size:11px;font-weight:600;color:var(--ink3);font-family:var(--mono)}
.btn-nd{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;padding:5px 12px;
  font-family:var(--font);font-size:11px;font-weight:600;
  color:var(--ink2);cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.06)
}
.btn-nd:active{background:var(--surface2)}

/* ── LAYOUT ── */
.wrap{max-width:520px;margin:0 auto;padding:0 12px}

/* ── SECTION LABEL ── */
.sec-label{
  font-size:10px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--ink3);
  padding:16px 4px 6px;display:flex;align-items:center;gap:8px
}
.sec-label::after{
  content:'';flex:1;height:1px;background:var(--border)
}

/* ── CARD ── */
.card{
  background:var(--surface);
  border-radius:var(--r);
  border:1px solid var(--border);
  margin-bottom:10px;
  overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.05)
}

/* ── INFO GRID ── */
.ig-grid{display:grid;grid-template-columns:1fr 1fr}
.ig{padding:10px 14px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.ig.full{grid-column:span 2;border-right:none}
.ig:nth-child(even):not(.full){border-right:none}
.ig:last-child{border-bottom:none}
.ig:nth-last-child(2):not(.full){border-bottom:none}
.ig-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.ig-inp{
  width:100%;font-family:var(--font);font-size:14px;font-weight:600;
  color:var(--ink);border:none;outline:none;background:transparent
}
.ig-inp[readonly]{color:var(--ink2)}
.ig-inp::placeholder{color:var(--ink3);font-weight:400;font-size:13px}

/* ── JAM BERANGKAT / TIBA HUB ── */
.jam-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px}
.jam-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.jbtn{
  width:100%;display:flex;flex-direction:column;align-items:center;
  padding:12px 8px;border-radius:12px;
  border:1.5px dashed var(--border2);
  background:var(--surface2);cursor:pointer;
  font-family:var(--font);gap:3px;transition:all .2s
}
.jbtn.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.jbtn:active{opacity:.7}
.jbtn-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.jbtn.on .jbtn-lbl{color:var(--ink2)}
.jbtn-val{font-size:22px;font-weight:700;color:var(--ink3);font-family:var(--mono)}
.jbtn.on .jbtn-val{color:var(--ink)}
@keyframes flash-dark{0%{background:#dcfce7}100%{background:var(--accent-soft)}}
.jbtn.flash{animation:flash-dark .5s ease}
.jedit{
  display:none;font-family:var(--font);font-size:10px;font-weight:700;
  color:var(--ink2);background:var(--accent-soft);
  border:1px solid var(--border2);border-radius:20px;padding:3px 12px;cursor:pointer
}
.jedit:active{background:var(--accent);color:#fff}

/* ── SS CGKG SPECIAL CARD ── */
.cgkg-card{
  background:var(--cgkg-bg);
  border:1.5px solid var(--cgkg-mid);
  border-radius:var(--r);
  margin-bottom:10px;
  overflow:hidden
}
.cgkg-hd{
  background:var(--cgkg);
  padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between
}
.cgkg-hd-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.cgkg-title-inp{
  display:block;width:100%;font-family:var(--font);font-size:14px;font-weight:700;
  color:#fff;background:transparent;border:none;border-bottom:1.5px dashed rgba(255,255,255,.35);
  outline:none;padding:0 0 2px
}
.cgkg-title-inp:focus{border-bottom-style:solid;border-bottom-color:#fff}
.cgkg-title-inp::placeholder{color:rgba(255,255,255,.5)}
.cgkg-sub-inp{
  display:block;width:100%;font-family:var(--font);font-size:10px;
  color:rgba(255,255,255,.6);background:transparent;border:none;
  border-bottom:1px dashed rgba(255,255,255,.2);outline:none;
  padding:2px 0 1px;margin-top:2px
}
.cgkg-sub-inp:focus{border-bottom-style:solid;border-bottom-color:rgba(255,255,255,.6)}
.cgkg-sub-inp::placeholder{color:rgba(255,255,255,.35)}
.cgkg-badge{
  width:28px;height:28px;border-radius:8px;
  background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:14px
}
.cgkg-title{font-size:14px;font-weight:700;color:#fff}
.cgkg-sub{font-size:10px;color:rgba(255,255,255,.6);margin-top:1px}
.cgkg-tag{
  font-size:9px;font-weight:700;letter-spacing:.5px;
  background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);
  border-radius:20px;padding:3px 10px
}
.cgkg-del{
  background:rgba(255,255,255,.15);border:none;border-radius:8px;
  width:26px;height:26px;font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;
  flex-shrink:0
}
.cgkg-del:active{background:rgba(255,255,255,.3)}

/* CGKG PKT ROW */
.cgkg-pkt{display:grid;grid-template-columns:2fr 1fr 1fr;border-bottom:1px solid var(--cgkg-mid)}
.cpkt{padding:10px 14px;border-right:1px solid var(--cgkg-mid)}
.cpkt:last-child{border-right:none}
.cpkt-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cgkg);margin-bottom:3px}
.cpkt-inp{
  width:100%;font-family:var(--mono);font-size:20px;font-weight:700;
  color:var(--cgkg);border:none;outline:none;background:transparent
}
.cpkt-inp::placeholder{color:var(--cgkg-mid);font-size:14px}

/* CGKG JAM */
.cgkg-jam{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px}
.cjam-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.cjbtn{
  width:100%;display:flex;flex-direction:column;align-items:center;
  padding:10px 8px;border-radius:10px;
  border:1.5px dashed var(--cgkg-mid);
  background:rgba(255,255,255,.5);cursor:pointer;
  font-family:var(--font);gap:3px;transition:all .2s
}
.cjbtn.on{border-style:solid;border-color:var(--cgkg);background:rgba(255,255,255,.85)}
.cjbtn:active{opacity:.7}
.cjbtn-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--cgkg);opacity:.6}
.cjbtn.on .cjbtn-lbl{opacity:1}
.cjbtn-val{font-size:20px;font-weight:700;color:var(--cgkg-mid);font-family:var(--mono)}
.cjbtn.on .cjbtn-val{color:var(--cgkg)}
@keyframes flash-green{0%{background:#bbf7d0}100%{background:rgba(255,255,255,.85)}}
.cjbtn.flash{animation:flash-green .5s ease}
.cjedit{
  display:none;font-family:var(--font);font-size:10px;font-weight:700;
  color:var(--cgkg);background:var(--cgkg-mid);
  border:none;border-radius:20px;padding:3px 12px;cursor:pointer
}
.cjedit:active{background:var(--cgkg);color:#fff}

/* ── STOP BIASA ── */
.stop{
  background:var(--surface);border-radius:var(--r);
  border:1px solid var(--border);margin-bottom:8px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.04)
}
.stop-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.stop-num{
  min-width:26px;height:26px;
  background:var(--ink);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
  font-family:var(--mono)
}
.stop-name{
  flex:1;font-family:var(--font);font-size:14px;font-weight:600;
  color:var(--ink);border:none;outline:none;background:transparent
}
.stop-name::placeholder{color:var(--ink3);font-weight:400}
.stop-del{background:none;border:none;color:var(--ink3);font-size:24px;cursor:pointer;line-height:1;border-radius:6px;padding:0 2px}
.stop-del:active{color:var(--warn)}

.pkt-row{display:grid;grid-template-columns:2fr 1fr 1fr;border-bottom:1px solid var(--border)}
.pkt{padding:8px 14px;border-right:1px solid var(--border)}
.pkt:last-child{border-right:none}
.pkt-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.pkt-inp{
  width:100%;font-family:var(--mono);font-size:16px;font-weight:700;
  color:var(--ink);border:none;outline:none;background:transparent
}
.pkt-inp::placeholder{color:var(--border2);font-size:13px}

.meta-row{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border)}
.meta-lbl{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--ink3);white-space:nowrap;text-transform:uppercase}
.meta-eta{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink2);border:none;outline:none;background:transparent;width:72px}
.meta-sep{color:var(--border2)}
.meta-ket{flex:1;font-family:var(--font);font-size:12px;color:var(--ink2);border:none;outline:none;background:transparent}
.meta-ket::placeholder{color:var(--ink3)}
.dev{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.dev-late{background:var(--warn-bg);color:var(--warn)}
.dev-ok{background:var(--green-bg);color:var(--green)}
.dev-early{background:var(--blue-bg);color:var(--blue)}

.times{display:grid;grid-template-columns:repeat(4,1fr)}
.tfield{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:8px;border-right:1px solid var(--border)}
.tfield:last-child{border-right:none}
.tbtn{
  width:100%;display:flex;flex-direction:column;align-items:center;
  padding:9px 4px 4px;border:none;background:transparent;cursor:pointer;
  font-family:var(--font);gap:2px;transition:background .1s
}
.tbtn:active{background:var(--surface2)}
.tbtn.on{background:var(--accent-soft)}
.tbtn-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.tbtn.on .tbtn-lbl{color:var(--ink2)}
.tbtn-val{font-size:14px;font-weight:700;color:var(--ink3);font-family:var(--mono)}
.tbtn.on .tbtn-val{color:var(--ink)}
.tedit{
  display:none;font-family:var(--font);font-size:10px;font-weight:700;
  color:var(--ink2);background:var(--accent-soft);
  border:1px solid var(--border2);border-radius:20px;padding:2px 8px;cursor:pointer
}
.tedit:active{background:var(--ink);color:#fff}

/* ── ADD STOP ── */
.btn-add{
  width:100%;padding:13px;
  background:transparent;
  border:1.5px dashed var(--border2);
  border-radius:var(--r);
  font-family:var(--font);font-size:14px;font-weight:600;
  color:var(--ink3);cursor:pointer;margin-bottom:10px;
  transition:all .2s
}
.btn-add:active{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}

/* ── REKAP TOTAL ── */
.rekap-card{
  background:var(--ink);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.15)
}
.rekap-title{
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.4);padding:12px 16px 6px
}
.rekap-grid{display:grid;grid-template-columns:repeat(3,1fr)}
.rk{padding:10px 12px 16px;text-align:center;border-right:1px solid rgba(255,255,255,.08)}
.rk:last-child{border-right:none}
.rk-num{font-size:28px;font-weight:700;color:#fff;font-family:var(--mono);line-height:1}
.rk-lbl{font-size:9px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.noted-wrap{padding:10px 16px;border-top:1px solid rgba(255,255,255,.08)}
.noted-inp{
  width:100%;font-family:var(--font);font-size:13px;
  color:rgba(255,255,255,.7);border:none;outline:none;
  background:transparent;resize:none
}
.noted-inp::placeholder{color:rgba(255,255,255,.2)}

/* ── CGKG SUMMARY (in rekap) ── */
.cgkg-sum{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-top:1px solid rgba(255,255,255,.08)
}
.cgkg-sum-lbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:rgba(134,239,172,.6);flex-shrink:0}
.cgkg-sum-vals{display:flex;gap:8px;flex-wrap:wrap}
.cgkg-chip{
  background:rgba(134,239,172,.1);border:1px solid rgba(134,239,172,.2);
  border-radius:20px;padding:3px 10px;
  font-size:11px;font-weight:700;color:#86efac;font-family:var(--mono)
}

/* ── BOTTOM BAR ── */
.bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(245,244,241,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:10px 12px;
  display:flex;flex-direction:column;gap:6px;
  z-index:100;
  box-shadow:0 -4px 24px rgba(0,0,0,.08)
}
.bar-row{display:flex;gap:6px}
.btn-cgkg{
  flex:1;padding:13px;
  background:var(--cgkg);
  border:none;border-radius:10px;
  font-family:var(--font);font-size:13px;font-weight:700;
  color:#fff;cursor:pointer;
  box-shadow:0 4px 12px rgba(15,76,58,.3)
}
.btn-cgkg:active{opacity:.85}
.btn-wa{
  flex:2;padding:13px;
  background:var(--ink);
  border:none;border-radius:10px;
  font-family:var(--font);font-size:13px;font-weight:700;
  color:#fff;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.2)
}
.btn-wa:active{opacity:.85}
.bar-hint{
  font-size:10px;text-align:center;color:var(--ink3);
  font-family:var(--mono)
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:130px;left:50%;
  transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:#fff;
  padding:9px 18px;border-radius:20px;
  font-size:12px;font-weight:600;
  opacity:0;transition:all .25s;z-index:999;
  pointer-events:none;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.2)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MODAL ── */
.modal-ov{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  z-index:300;align-items:flex-end;justify-content:center
}
.modal-ov.open{display:flex}
.modal-box{
  background:var(--surface);border-radius:24px 24px 0 0;
  padding:20px 20px 32px;width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 -8px 40px rgba(0,0,0,.2)
}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin-bottom:4px}
.modal-lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3)}
.modal-inp{
  font-family:var(--mono);font-size:48px;font-weight:700;
  color:var(--ink);border:none;outline:none;
  text-align:center;background:transparent;width:100%;
  border-bottom:2px solid var(--border);padding-bottom:6px
}
.modal-btns{display:flex;gap:8px;width:100%;margin-top:4px}
.modal-cancel{
  flex:1;padding:14px;background:var(--surface2);
  border:1px solid var(--border);border-radius:12px;
  font-family:var(--font);font-size:14px;font-weight:700;
  color:var(--ink2);cursor:pointer
}
.modal-ok{
  flex:2;padding:14px;background:var(--ink);
  border:none;border-radius:12px;
  font-family:var(--font);font-size:14px;font-weight:700;
  color:#fff;cursor:pointer
}
.modal-ok:active{opacity:.85}
.modal-reset{
  background:none;border:none;color:var(--ink3);
  font-family:var(--font);font-size:12px;font-weight:600;
  cursor:pointer;padding:4px 8px;border-radius:6px
}
.modal-reset:active{color:var(--warn)}

/* ── REPORT PREVIEW MODAL ── */
.preview-ov{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  z-index:400;align-items:flex-end;justify-content:center
}
.preview-ov.open{display:flex}
.preview-box{
  background:var(--surface);border-radius:24px 24px 0 0;
  padding:20px 0 32px;width:100%;max-width:520px;
  max-height:85vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(0,0,0,.3)
}
.preview-hd{
  padding:0 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border)
}
.preview-title{font-size:15px;font-weight:700}
.preview-close{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:4px 12px;
  font-family:var(--font);font-size:12px;font-weight:600;
  color:var(--ink2);cursor:pointer
}
.preview-body{
  flex:1;overflow-y:auto;padding:16px 20px
}
.preview-text{
  font-family:var(--mono);font-size:12px;line-height:1.8;
  color:var(--ink);white-space:pre-wrap;
  background:var(--surface2);border-radius:12px;padding:16px;
  border:1px solid var(--border)
}
.preview-btns{
  display:flex;gap:8px;padding:12px 20px 0
}
.preview-copy{

<script>
const PKEY='bts_p3', DKEY='bts_d3';
let stopIdx=0, modalCtx=null, currentReport='';
let tripCount=1;
let cgkgEnabled=true;

// ── TOGGLE SS CGKG ──
function cgkgName(){ return ($('cgkg-name')?.value||'').trim() || 'SS CGKG'; }
function updateCgkgLabels(){
  const name=cgkgName();
  $('cgkg-sec-label').textContent=name;
  $('cgkg-sum-lbl').textContent=name;
  $('btn-cgkg-report').textContent='📋 Report '+name;
  $('btn-add-cgkg').textContent='＋ Tambah '+name;
  $('cgkg-del-btn').title='Hapus '+name;
  $('rekap-title-main').textContent='Total Titik Kirim (diluar '+name+')';
}
function toggleCgkg(enabled,silent){
  cgkgEnabled=enabled;
  $('cgkg-section').style.display=enabled?'':'none';
  $('btn-add-cgkg').style.display=enabled?'none':'';
  $('cgkg-sum-row').style.display=enabled?'':'none';
  $('btn-cgkg-report').style.display=enabled?'':'none';
  if(silent) return;
  if(!enabled) toast('🗑️ '+cgkgName()+' dihapus dari report');
  else toast('📦 '+cgkgName()+' ditambahkan kembali');
  autoSave();
}

function $(id){ return document.getElementById(id); }
function nowt(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

// ── TOAST ──
function toast(msg){
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2200);
}

// ── PILL ──
function pillOk(){
  const p=$('pill'); p.classList.add('ok'); p.textContent='Tersimpan';
  clearTimeout(p._t); p._t=setTimeout(()=>{ p.classList.remove('ok'); p.textContent='Draft'; },1800);
}

// ── DATE HEADER ──
function updateDateHeader(){
  const tgl=$('f-tgl').value;
  if(!tgl) return;
  const d=new Date(tgl+'T12:00');
  const days=['MINGGU','SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU'];
  const months=['JAN','FEB','MAR','APR','MEI','JUN','JUL','AGS','SEP','OKT','NOV','DES'];
  $('di-date').textContent=`${String(d.getDate()).padStart(2,'0')}/${months[d.getMonth()]}/${d.getFullYear()}`;
  $('subbar-day').textContent=`${days[d.getDay()]} · ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

// ── TRIP ──
function adjTrip(n){
  tripCount=Math.max(1,Math.min(9,tripCount+n));
  $('trip-val').textContent=tripCount;
  $('trip-label').textContent=`Trip ${tripCount}`;
  autoSave();
}

// ── REKAP ──
function stopIds(){ return [...document.querySelectorAll('.stop')].map(el=>+el.id.split('-')[1]); }
function rekal(){
  const cgkgP=+($('cgkg-paket')?.value||0);
  const cgkgM=+($('cgkg-mb')?.value||0);
  const cgkgB=+($('cgkg-bp')?.value||0);
  // Total keseluruhan = hanya titik kirim (TANPA CGKG)
  let p=0, m=0, b=0;
  stopIds().forEach(i=>{
    p+=+($(`sp-${i}`)?.value||0);
    m+=+($(`sm-${i}`)?.value||0);
    b+=+($(`sb-${i}`)?.value||0);
  });
  $('r-paket').textContent=p.toLocaleString('id');
  $('r-mb').textContent=m;
  $('r-bp').textContent=b;
  // Summary CGKG terpisah di bawah
  $('sum-cgkg-paket').textContent=cgkgP+' PKT';
  $('sum-cgkg-mb').textContent=cgkgM+' MB';
  $('sum-cgkg-bp').textContent=cgkgB+' BP';
}

// ── ADD STOP ──
function addStop(d={}){
  stopIdx++; const i=stopIdx;
  const el=document.createElement('div');
  el.className='stop'; el.id=`stop-${i}`;
  el.innerHTML=`
    <div class="stop-hd">
      <div class="stop-num">${i}</div>
      <input class="stop-name" id="sn-${i}" placeholder="Nama titik kirim..." value="${esc(d.nama)}">
      <button class="stop-del" onclick="delStop(${i})">×</button>
    </div>
    <div class="pkt-row">
      <div class="pkt"><div class="pkt-lbl">Paket</div><input class="pkt-inp" id="sp-${i}" type="number" inputmode="numeric" placeholder="0" value="${d.paket||''}"></div>
      <div class="pkt"><div class="pkt-lbl">MB</div><input class="pkt-inp" id="sm-${i}" type="number" inputmode="numeric" placeholder="0" value="${d.mb||''}"></div>
      <div class="pkt"><div class="pkt-lbl">BP</div><input class="pkt-inp" id="sb-${i}" type="number" inputmode="numeric" placeholder="0" value="${d.bp||''}"></div>
    </div>
    <div class="meta-row">
      <span class="meta-lbl">ETA</span>
      <input class="meta-eta" id="se-${i}" type="time" value="${d.eta||''}">
      <span class="meta-sep">|</span>
      <input class="meta-ket" id="sk-${i}" placeholder="keterangan..." value="${esc(d.ket)}">
      <div id="dev-${i}" style="display:none"></div>
    </div>
    <div class="times">
      ${['Tiba','Proses','Selesai','Brkt'].map(k=>`
      <div class="tfield">
        <button class="tbtn" id="tbtn-${k}-${i}" onclick="stampTime('${k}',${i})">
          <div class="tbtn-lbl">${k}</div>
          <div class="tbtn-val" id="tval-${k}-${i}">--:--</div>
        </button>
        <button class="tedit" id="tedit-${k}-${i}" onclick="openModal('stop','${k}',${i})">✏️</button>
      </div>`).join('')}
    </div>`;
  $('stops').appendChild(el);
  $(`se-${i}`).addEventListener('input',()=>{ calcDev(i); autoSave(); });
  $(`sk-${i}`).addEventListener('input', autoSave);
  ['Tiba','Proses','Selesai','Brkt'].forEach(k=>{ const v=d[k.toLowerCase()]; if(v&&v!=='-') _setTime(k,i,v); });
  calcDev(i); rekal();
}

function delStop(i){ $(`stop-${i}`)?.remove(); rekal(); autoSave(); }

// ── STAMP ──
function stampTime(k,i){
  if($(`tbtn-${k}-${i}`)?.dataset?.t) return;
  _setTime(k,i,nowt());
  $(`tbtn-${k}-${i}`).classList.add('flash');
  setTimeout(()=>$(`tbtn-${k}-${i}`)?.classList.remove('flash'),500);
  calcDev(i); autoSave();
}
function stampJam(key){
  if($(`jbtn-${key}`)?.dataset?.t) return;
  _applyJam(key,nowt());
  $(`jbtn-${key}`).classList.add('flash');
  setTimeout(()=>$(`jbtn-${key}`)?.classList.remove('flash'),500);
  autoSave();
}
function stampCgkg(key){
  if($(`cjbtn-${key}`)?.dataset?.t) return;
  _applyCgkgJam(key,nowt());
  $(`cjbtn-${key}`).classList.add('flash');
  setTimeout(()=>$(`cjbtn-${key}`)?.classList.remove('flash'),500);
  autoSave();
}

// ── SET/CLEAR ──
function _setTime(k,i,t){
  const btn=$(`tbtn-${k}-${i}`), val=$(`tval-${k}-${i}`), edit=$(`tedit-${k}-${i}`);
  if(!btn||!val) return;
  btn.dataset.t=t; val.textContent=t; btn.classList.add('on');
  if(edit) edit.style.display='inline-block';
}
function _clearTime(k,i){
  const btn=$(`tbtn-${k}-${i}`), val=$(`tval-${k}-${i}`), edit=$(`tedit-${k}-${i}`);
  if(btn){ btn.dataset.t=''; btn.classList.remove('on','flash'); }
  if(val) val.textContent='--:--';
  if(edit) edit.style.display='none';
}
function _applyJam(key,t){
  const btn=$(`jbtn-${key}`), val=$(`jval-${key}`), edit=$(`jedit-${key}`);
  if(!btn||!val) return;
  btn.dataset.t=t; val.textContent=t; btn.classList.add('on');
  if(edit) edit.style.display='inline-block';
}
function _clearJam(key){
  const btn=$(`jbtn-${key}`), val=$(`jval-${key}`), edit=$(`jedit-${key}`);
  if(btn){ btn.dataset.t=''; btn.classList.remove('on','flash'); }
  if(val) val.textContent='--:--';
  if(edit) edit.style.display='none';
}
function _applyCgkgJam(key,t){
  const btn=$(`cjbtn-${key}`), val=$(`cjval-${key}`), edit=$(`cjedit-${key}`);
  if(!btn||!val) return;
  btn.dataset.t=t; val.textContent=t; btn.classList.add('on');
  if(edit) edit.style.display='inline-block';
}
function _clearCgkgJam(key){
  const btn=$(`cjbtn-${key}`), val=$(`cjval-${key}`), edit=$(`cjedit-${key}`);
  if(btn){ btn.dataset.t=''; btn.classList.remove('on','flash'); }
  if(val) val.textContent='--:--';
  if(edit) edit.style.display='none';
}

// ── DEV CHIP ──
function calcDev(i){
  const eta=$(`se-${i}`)?.value, t=$(`tbtn-Tiba-${i}`)?.dataset?.t, chip=$(`dev-${i}`);
  if(!chip) return;
  if(!eta||!t){ chip.style.display='none'; return; }
  const [eh,em]=eta.split(':').map(Number), [th,tm]=t.split(':').map(Number);
  const diff=(th*60+tm)-(eh*60+em);
  chip.style.display='block';
  if(diff===0){ chip.className='dev dev-ok'; chip.textContent='Tepat'; }
  else if(diff>0){ chip.className='dev dev-late'; chip.textContent=`+${diff}m`; }
  else{ chip.className='dev dev-early'; chip.textContent=`${diff}m`; }
}

// ── MODAL ──
function openModal(type,...args){
  let lbl, cur;
  if(type==='jam'){
    const key=args[0]; modalCtx={type:'jam',key};
    lbl=key==='brkt'?'HUB STR':'Tiba HUB';
    cur=$(`jbtn-${key}`)?.dataset?.t||'';
  } else if(type==='cgkg'){
    const key=args[0]; modalCtx={type:'cgkg',key};
    lbl=key==='tiba'?('Tiba '+cgkgName()):('Berangkat '+cgkgName());
    cur=$(`cjbtn-${key}`)?.dataset?.t||'';
  } else {
    const [k,i]=args; modalCtx={type:'stop',k,i};
    lbl=k; cur=$(`tbtn-${k}-${i}`)?.dataset?.t||'';
  }
  $('modal-lbl').textContent='Edit — '+lbl;
  $('modal-inp').value=cur;
  $('modal-ov').classList.add('open');
  setTimeout(()=>$('modal-inp').focus(),80);
}
function closeModal(){ $('modal-ov').classList.remove('open'); modalCtx=null; }
function saveModal(){
  const val=$('modal-inp').value;
  if(!val){ closeModal(); return; }
  if(modalCtx?.type==='jam') _applyJam(modalCtx.key,val);
  else if(modalCtx?.type==='cgkg') _applyCgkgJam(modalCtx.key,val);
  else if(modalCtx?.type==='stop'){ _setTime(modalCtx.k,modalCtx.i,val); calcDev(modalCtx.i); }
  autoSave(); closeModal();
}
function resetModal(){
  if(modalCtx?.type==='jam') _clearJam(modalCtx.key);
  else if(modalCtx?.type==='cgkg') _clearCgkgJam(modalCtx.key);
  else if(modalCtx?.type==='stop'){ _clearTime(modalCtx.k,modalCtx.i); calcDev(modalCtx.i); }
  autoSave(); closeModal();
}

// ── HARI BARU ──
function newDay(){
  if(!confirm('Reset data harian?\n(Nama titik kirim tetap tersimpan)')) return;
  $('f-tgl').value=new Date().toISOString().split('T')[0];
  $('f-noted').value='';
  tripCount=1; $('trip-val').textContent=1; $('trip-label').textContent='Trip 1';
  ['brkt','hub'].forEach(k=>_clearJam(k));
  ['tiba','brkt'].forEach(k=>_clearCgkgJam(k));
  ['cgkg-paket','cgkg-mb','cgkg-bp'].forEach(id=>{ const el=$(id); if(el) el.value=''; });
  stopIds().forEach(i=>{
    ['Tiba','Proses','Selesai','Brkt'].forEach(k=>_clearTime(k,i));
    const dev=$(`dev-${i}`); if(dev) dev.style.display='none';
    [$(`sp-${i}`),$(`sm-${i}`),$(`sb-${i}`),$(`se-${i}`),$(`sk-${i}`)].forEach(el=>{ if(el) el.value=''; });
  });
  rekal(); updateDateHeader();
  localStorage.removeItem(DKEY); autoSave();
  toast('🔄 Siap hari baru!');
}

// ── GENERATE REPORT ──
function getDateParts(){
  const tgl=$('f-tgl').value;
  if(!tgl) return { hari:'—', tglFmt:'—', tglFmtShort:'—' };
  const d=new Date(tgl+'T12:00');
  const HARI=['MINGGU','SENIN','SELASA','RABU','KAMIS','JUMAT','SABTU'];
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yyyy=d.getFullYear();
  return {
    hari:HARI[d.getDay()],
    tglFmt:`${dd}-${mm}-${yyyy}`,
    tglFull:d.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})
  };
}

function buildCgkgReport(){
  const {hari,tglFmt}=getDateParts();
  const satmob=$('f-satmob').value||'-';
  const plat=$('f-plat').value||'B 9596 UCY';
  const asmob=$('f-asmob').value||'RIDZKY RAMADHAN';
  const rute=$('f-rute').value||'STR-CGKG';
  const trip=$('trip-val').textContent||'1';
  const hubStr=$('jbtn-brkt')?.dataset?.t||'--:--';
  const inCgkg=$('cjbtn-tiba')?.dataset?.t||'--:--';
  const cgkgMb=+($('cgkg-mb')?.value||0);
  const cgkgBp=+($('cgkg-bp')?.value||0);
  const cgkgPaket=+($('cgkg-paket')?.value||0);

  let txt='*REPORT DELIVERY HUB SUNTER*\n\n';
  txt+=`HARI              : ${hari}\n`;
  txt+=`TANGGAL     : ${tglFmt}\n`;
  txt+=`NOPOL          : ${plat}\n`;
  txt+=`DRIVER          : ${satmob}\n`;
  txt+=`ASMOB          : ${asmob}\n`;
  txt+=`RUTE              : ${rute}\n`;
  txt+=`TRIP                : ${trip}\n\n`;
  txt+=`HUB STR            : ${hubStr}\n`;
  txt+=`IN ${cgkgName().toUpperCase().padEnd(16)} : ${inCgkg}\n\n`;
  txt+=`ISI MUATAN \n`;
  if(cgkgMb>0) txt+=`${cgkgMb} MB\n`;
  if(cgkgBp>0) txt+=`${cgkgBp} BP\n`;
  txt+=`TOTAL PARCEL *${cgkgPaket.toLocaleString('id')}*`;
  return txt;
}

function buildAllReport(){
  const {hari,tglFull,tglFmt}=getDateParts();
  const tgl=$('f-tgl').value;
  const d=tgl?new Date(tgl+'T12:00'):new Date();
  const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const yyyy=d.getFullYear();
  const tglFormatted=HARI[d.getDay()]+', '+dd+'/'+mm+'/'+yyyy;

  const satmob=$('f-satmob').value||'-';
  const plat=$('f-plat').value||'B 9596 UCY';
  const asmob=$('f-asmob').value||'RIDZKY RAMADHAN';
  const rute=$('f-rute').value||'STR-CGKG';
  const brkt=$('jbtn-brkt')?.dataset?.t||'-';
  const hub=$('jbtn-hub')?.dataset?.t||'-';
  const cgkgP=+($('cgkg-paket')?.value||0);
  const cgkgM=+($('cgkg-mb')?.value||0);
  const cgkgB=+($('cgkg-bp')?.value||0);
  const cgkgTiba=$('cjbtn-tiba')?.dataset?.t||'-';
  const cgkgBrkt=$('cjbtn-brkt')?.dataset?.t||'-';

  // Header
  let txt='*Daily Report BTS*\n\n';
  txt+='*Satmob : '+satmob+'*\n';
  txt+='*Asmob : '+asmob+'*\n';
  txt+='*Hari & Tanggal : '+tglFormatted+'*\n';
  txt+='*Plat Mobil : '+plat+'*\n';
  txt+='*Rute : '+rute+'*\n\n';
  txt+='*Berangkat : '+brkt+'*\n\n';

  // SS CGKG — info saja, tidak masuk total (dilewati jika dihapus)
  if(cgkgEnabled){
    const cgkgExt=[];
    if(cgkgM>0) cgkgExt.push(cgkgM+'MB');
    if(cgkgB>0) cgkgExt.push(cgkgB+'BP');
    var cgkgExtStr=cgkgExt.length?' ('+cgkgExt.join(' + ')+')':'';
    txt+='*'+cgkgName()+' : '+cgkgP.toLocaleString('id')+cgkgExtStr+'*\n\n';
    txt+='Tiba : '+cgkgTiba+'\n';
    txt+='Berangkat : '+cgkgBrkt+'\n\n';
  }

  // Titik Kirim (TANPA CGKG)
  stopIds().forEach(i=>{
    const nama=$('sn-'+i)?.value||'Stop '+i;
    const paket=+($('sp-'+i)?.value||0);
    const mb=+($('sm-'+i)?.value||0);
    const bp=+($('sb-'+i)?.value||0);
    const eta=$('se-'+i)?.value||'';
    const ket=$('sk-'+i)?.value||'';
    const tiba=$('tbtn-Tiba-'+i)?.dataset?.t||'-';
    const proses=$('tbtn-Proses-'+i)?.dataset?.t||'-';
    const selesai=$('tbtn-Selesai-'+i)?.dataset?.t||'-';
    const sbrkt=$('tbtn-Brkt-'+i)?.dataset?.t||'-';
    const ext=[];
    if(mb>0) ext.push(mb+'MB');
    if(bp>0) ext.push(bp+'BP');
    var extStr=ext.length?' ('+ext.join(' + ')+')':'';
    txt+='*'+nama+' : '+paket.toLocaleString('id')+extStr+'*\n';
    if(eta) txt+='ETA : '+eta+'\n';
    if(ket) txt+='KET : '+ket+'\n\n';
    else txt+='\n';
    txt+='Tiba : '+tiba+'\n';
    txt+='Proses : '+proses+'\n';
    txt+='Selesai : '+selesai+'\n';
    txt+='Berangkat : '+sbrkt+'\n\n';
  });

  // Total hanya titik kirim (TANPA CGKG)
  let tp=0, tm=0, tb=0;
  stopIds().forEach(i=>{
    tp+=+($('sp-'+i)?.value||0);
    tm+=+($('sm-'+i)?.value||0);
    tb+=+($('sb-'+i)?.value||0);
  });
  txt+='*Total Bulky Reguler : '+tp.toLocaleString('id')+'*\n';
  txt+='*Total MB : '+tm+'*\n';
  txt+='*Total BP : '+tb+'*\n\n';
  if($('f-noted').value) txt+=$('f-noted').value+'\n\n';
  txt+='Tiba di HUB : '+hub;
  return txt;
}

// ── PREVIEW & SEND ──
let _previewMode='all';
function showReport(mode){
  _previewMode=mode;
  const txt=mode==='cgkg'?buildCgkgReport():buildAllReport();
  currentReport=txt;
  $('preview-title').textContent=mode==='cgkg'?('Report '+cgkgName()):'Report Keseluruhan';
  $('preview-text').textContent=txt;
  $('preview-ov').classList.add('open');
}
function closePreview(){ $('preview-ov').classList.remove('open'); }
function copyReport(){
  navigator.clipboard?.writeText(currentReport).then(()=>toast('✅ Tersalin!')).catch(()=>fallbackCopy(currentReport));
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); ta.remove();
  toast('✅ Tersalin!');
}
function sendWa(){
  window.open('whatsapp://send?text='+encodeURIComponent(currentReport),'_blank');
  closePreview();
}

// ── SAVE / LOAD ──
let _st;
function autoSave(){ clearTimeout(_st); _st=setTimeout(_doSave,400); }
function _doSave(){
  try{
    localStorage.setItem(PKEY,JSON.stringify({
      satmob:$('f-satmob').value, asmob:$('f-asmob').value,
      plat:$('f-plat').value, rute:$('f-rute').value,
      cgkgEnabled:cgkgEnabled,
      cgkgName:$('cgkg-name')?.value||'',
      stops:stopIds().map(i=>({ nama:$(`sn-${i}`)?.value||'' }))
    }));
    localStorage.setItem(DKEY,JSON.stringify({
      tgl:$('f-tgl').value, noted:$('f-noted').value,
      trip:tripCount,
      brkt:$('jbtn-brkt')?.dataset?.t||'',
      hub:$('jbtn-hub')?.dataset?.t||'',
      cgkgPaket:$('cgkg-paket')?.value||'',
      cgkgMb:$('cgkg-mb')?.value||'',
      cgkgBp:$('cgkg-bp')?.value||'',
      cgkgTiba:$('cjbtn-tiba')?.dataset?.t||'',
      cgkgBrkt:$('cjbtn-brkt')?.dataset?.t||'',
      stops:stopIds().map(i=>({
        paket:$(`sp-${i}`)?.value||'', mb:$(`sm-${i}`)?.value||'',
        bp:$(`sb-${i}`)?.value||'', eta:$(`se-${i}`)?.value||'',
        ket:$(`sk-${i}`)?.value||'',
        tiba:$(`tbtn-Tiba-${i}`)?.dataset?.t||'',
        proses:$(`tbtn-Proses-${i}`)?.dataset?.t||'',
        selesai:$(`tbtn-Selesai-${i}`)?.dataset?.t||'',
        brkt:$(`tbtn-Brkt-${i}`)?.dataset?.t||'',
      }))
    }));
    pillOk();
  }catch(e){}
}

function load(){
  try{
    const pRaw=localStorage.getItem(PKEY), dRaw=localStorage.getItem(DKEY);
    if(!pRaw&&!dRaw) return false;
    const p=pRaw?JSON.parse(pRaw):{}, d=dRaw?JSON.parse(dRaw):{};
    $('f-satmob').value=p.satmob||'';
    $('f-asmob').value=p.asmob||'RIDZKY RAMADHAN';
    $('f-plat').value=p.plat||'B 9596 UCY';
    $('f-rute').value=p.rute||'STR-CGKG';
    $('cgkg-name').value=p.cgkgName||'SS CGKG';
    toggleCgkg(p.cgkgEnabled!==false,true);
    updateCgkgLabels();
    $('f-tgl').value=d.tgl||new Date().toISOString().split('T')[0];
    $('f-noted').value=d.noted||'';
    if(d.trip){ tripCount=d.trip; $('trip-val').textContent=d.trip; $('trip-label').textContent=`Trip ${d.trip}`; }
    if(d.brkt) _applyJam('brkt',d.brkt);
    if(d.hub)  _applyJam('hub',d.hub);
    if(d.cgkgPaket) $('cgkg-paket').value=d.cgkgPaket;
    if(d.cgkgMb)    $('cgkg-mb').value=d.cgkgMb;
    if(d.cgkgBp)    $('cgkg-bp').value=d.cgkgBp;
    if(d.cgkgTiba)  _applyCgkgJam('tiba',d.cgkgTiba);
    if(d.cgkgBrkt)  _applyCgkgJam('brkt',d.cgkgBrkt);
    const ps=p.stops||[], ds=d.stops||[];
    ps.forEach((s,idx)=>{
      const ds2=ds[idx]||{};
      addStop({
        nama:s.nama, paket:ds2.paket||'', mb:ds2.mb||'', bp:ds2.bp||'',
        eta:ds2.eta||'', ket:ds2.ket||'',
        tiba:ds2.tiba, proses:ds2.proses, selesai:ds2.selesai, brkt:ds2.brkt
      });
    });
    rekal(); updateDateHeader();
    return true;
  }catch(e){ return false; }
}

// ── INPUT LISTENER ──
document.addEventListener('input', e=>{
  if(e.target?.id==='f-tgl'){ updateDateHeader(); }
  if(e.target?.id==='cgkg-name'){ updateCgkgLabels(); }
  rekal(); autoSave();
});

// ── AUTO DETECT HARI BARU ──
function checkNewDay(){
  try{
    const dRaw=localStorage.getItem(DKEY);
    if(!dRaw) return;
    const d=JSON.parse(dRaw);
    const today=new Date().toISOString().split('T')[0];
    if(d.tgl && d.tgl!==today){
      $('f-tgl').value=today;
      updateDateHeader();
      toast('🌅 Selamat pagi! Jangan lupa reset hari baru.');
    }
  }catch(e){}
}

// ── INIT ──
if(!load()){
  $('f-tgl').value=new Date().toISOString().split('T')[0];
  $('f-asmob').value='RIDZKY RAMADHAN';
  $('f-plat').value='B 9596 UCY';
  $('f-rute').value='STR-CGKG';
  updateCgkgLabels();
  updateDateHeader();
} else {
  checkNewDay();
}
setInterval(checkNewDay, 60000);
</script>
