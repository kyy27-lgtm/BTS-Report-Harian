<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BTS Report Daily</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" id="pwa-icon">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f4f1;
  --surface:#ffffff;
  --surface2:#f0efe9;
  --border:#e4e2db;
  --border2:#d0cec5;
  --ink:#1a1917;
  --ink2:#5c5a54;
  --ink3:#9c9a92;
  --accent:#1a1917;
  --accent-soft:#e8e6e0;
  --cgkg:#0f4c3a;
  --cgkg-bg:#e8f5f0;
  --cgkg-mid:#c2e8db;
  --warn:#c2410c;
  --warn-bg:#fff7ed;
  --blue:#1e40af;
  --blue-bg:#eff6ff;
  --green:#15803d;
  --green-bg:#f0fdf4;
  --r:14px;
  --font:'DM Sans',sans-serif;
  --mono:'Space Mono',monospace
}

body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  padding-bottom:140px;
  min-height:100vh
}

/* ── DYNAMIC ISLAND ── */
.di-wrap{
  position:sticky;top:0;z-index:200;
  background:var(--bg);
  padding:10px 16px 6px;
  display:flex;justify-content:center
}
.di{
  background:var(--ink);
  border-radius:40px;
  padding:10px 20px;
  display:flex;align-items:center;gap:12px;
  width:100%;max-width:340px;
  box-shadow:0 8px 32px rgba(0,0,0,.25);
  position:relative;overflow:hidden
}
.di::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 60%);
  pointer-events:none
}
.di-icon{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,#3b82f6,#1d4ed8);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0
}
.di-info{flex:1;overflow:hidden}
.di-title{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.di-sub{font-size:10px;color:rgba(255,255,255,.45);font-family:var(--mono)}
.di-pill{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;padding:3px 10px;
  font-size:10px;font-weight:600;color:rgba(255,255,255,.6);
  white-space:nowrap
}
.di-pill.ok{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#4ade80}

/* ── SECOND BAR ── */
.subbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px 10px;
  position:sticky;top:58px;z-index:190;
  background:var(--bg)
}
.subbar-date{font-size:11px;font-weight:600;color:var(--ink3);font-family:var(--mono)}
.btn-nd{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;padding:5px 12px;
  font-family:var(--font);font-size:11px;font-weight:600;
  color:var(--ink2);cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.06)
}
.btn-nd:active{background:var(--surface2)}

/* ── LAYOUT ── */
.wrap{max-width:520px;margin:0 auto;padding:0 12px}

/* ── SECTION LABEL ── */
.sec-label{
  font-size:10px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--ink3);
  padding:16px 4px 6px;display:flex;align-items:center;gap:8px
}
.sec-label::after{
  content:'';flex:1;height:1px;background:var(--border)
}

/* ── CARD ── */
.card{
  background:var(--surface);
  border-radius:var(--r);
  border:1px solid var(--border);
  margin-bottom:10px;
  overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.05)
}

/* ── INFO GRID ── */
.ig-grid{display:grid;grid-template-columns:1fr 1fr}
.ig{padding:10px 14px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.ig.full{grid-column:span 2;border-right:none}
.ig:nth-child(even):not(.full){border-right:none}
.ig:last-child{border-bottom:none}
.ig:nth-last-child(2):not(.full){border-bottom:none}
.ig-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.ig-inp{
  width:100%;font-family:var(--font);font-size:14px;font-weight:600;
  color:var(--ink);border:none;outline:none;background:transparent
}
.ig-inp[readonly]{color:var(--ink2)}
.ig-inp::placeholder{color:var(--ink3);font-weight:400;font-size:13px}

/* ── JAM BERANGKAT / TIBA HUB ── */
.jam-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px}
.jam-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.jbtn{
  width:100%;display:flex;flex-direction:column;align-items:center;
  padding:12px 8px;border-radius:12px;
  border:1.5px dashed var(--border2);
  background:var(--surface2);cursor:pointer;
  font-family:var(--font);gap:3px;transition:all .2s
}
.jbtn.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.jbtn:active{opacity:.7}
.jbtn-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.jbtn.on .jbtn-lbl{color:var(--ink2)}
.jbtn-val{font-size:22px;font-weight:700;color:var(--ink3);font-family:var(--mono)}
.jbtn.on .jbtn-val{color:var(--ink)}
@keyframes flash-dark{0%{background:#dcfce7}100%{background:var(--accent-soft)}}
.jbtn.flash{animation:flash-dark .5s ease}
.jedit{
  display:none;font-family:var(--font);font-size:10px;font-weight:700;
  color:var(--ink2);background:var(--accent-soft);
  border:1px solid var(--border2);border-radius:20px;padding:3px 12px;cursor:pointer
}
.jedit:active{background:var(--accent);color:#fff}

/* ── SS CGKG SPECIAL CARD ── */
.cgkg-card{
  background:var(--cgkg-bg);
  border:1.5px solid var(--cgkg-mid);
  border-radius:var(--r);
  margin-bottom:10px;
  overflow:hidden
}
.cgkg-hd{
  background:var(--cgkg);
  padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between
}
.cgkg-hd-left{display:flex;align-items:center;gap:8px}
.cgkg-badge{
  width:28px;height:28px;border-radius:8px;
  background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:14px
}
.cgkg-title{font-size:14px;font-weight:700;color:#fff}
.cgkg-sub{font-size:10px;color:rgba(255,255,255,.6);margin-top:1px}
.cgkg-tag{
  font-size:9px;font-weight:700;letter-spacing:.5px;
  background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);
  border-radius:20px;padding:3px 10px
}

/* CGKG PKT ROW */
.cgkg-pkt{display:grid;grid-template-columns:2fr 1fr 1fr;border-bottom:1px solid var(--cgkg-mid)}
.cpkt{padding:10px 14px;border-right:1px solid var(--cgkg-mid)}
.cpkt:last-child{border-right:none}
.cpkt-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cgkg);margin-bottom:3px}
.cpkt-inp{
  width:100%;font-family:var(--mono);font-size:20px;font-weight:700;
  color:var(--cgkg);border:none;outline:none;background:transparent
}
.cpkt-inp::placeholder{color:var(--cgkg-mid);font-size:14px}

/* CGKG JAM */
.cgkg-jam{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px}
.cjam-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.cjbtn{
  width:100%;display:flex;flex-direction:column;align-items:center;
  padding:10px 8px;border-radius:10px;
  border:1.5px dashed var(--cgkg-mid);
  background:rgba(255,255,255,.5);cursor:pointer;
  font-family:var(--font);gap:3px;transition:all .2s
}
.cjbtn.on{border-style:solid;border-color:var(--cgkg);background:rgba(255,255,255,.85)}
.cjbtn:active{opacity:.7}
.cjbtn-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--cgkg);opacity:.6}
.cjbtn.on .cjbtn-lbl{opacity:1}
.cjbtn-val{font-size:20px;font-weight:700;color:var(--cgkg-mid);font-family:var(--mono)}
.cjbtn.on .cjbtn-val{color:var(--cgkg)}
@keyframes flash-green{0%{background:#bbf7d0}100%{background:rgba(255,255,255,.85)}}
.cjbtn.flash{animation:flash-green .5s ease}
.cjedit{
  display:none;font-family:var(--font);font-size:10px;font-weight:700;
  color:var(--cgkg);background:var(--cgkg-mid);
  border:none;border-radius:20px;padding:3px 12px;cursor:pointer
}
.cjedit:active{background:var(--cgkg);color:#fff}

/* ── STOP BIASA ── */
.stop{
  background:var(--surface);border-radius:var(--r);
  border:1px solid var(--border);margin-bottom:8px;overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.04)
}
.stop-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.stop-num{
  min-width:26px;height:26px;
  background:var(--ink);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
  font-family:var(--mono)
}
.stop-name{
  flex:1;font-family:var(--font);font-size:14px;font-weight:600;
  color:var(--ink);border:none;outline:none;background:transparent
}
.stop-name::placeholder{color:var(--ink3);font-weight:400}
.stop-del{background:none;border:none;color:var(--ink3);font-size:24px;cursor:pointer;line-height:1;border-radius:6px;padding:0 2px}
.stop-del:active{color:var(--warn)}

.pkt-row{display:grid;grid-template-columns:2fr 1fr 1fr;border-bottom:1px solid var(--border)}
.pkt{padding:8px 14px;border-right:1px solid var(--border)}
.pkt:last-child{border-right:none}
.pkt-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.pkt-inp{
  width:100%;font-family:var(--mono);font-size:16px;font-weight:700;
  color:var(--ink);border:none;outline:none;background:transparent
}
.pkt-inp::placeholder{color:var(--border2);font-size:13px}

.meta-row{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border)}
.meta-lbl{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--ink3);white-space:nowrap;text-transform:uppercase}
.meta-eta{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink2);border:none;outline:none;background:transparent;width:72px}
.meta-sep{color:var(--border2)}
.meta-ket{flex:1;font-family:var(--font);font-size:12px;color:var(--ink2);border:none;outline:none;background:transparent}
.meta-ket::placeholder{color:var(--ink3)}
.dev{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.dev-late{background:var(--warn-bg);color:var(--warn)}
.dev-ok{background:var(--green-bg);color:var(--green)}
.dev-early{background:var(--blue-bg);color:var(--blue)}

.times{display:grid;grid-template-columns:repeat(4,1fr)}
.tfield{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:8px;border-right:1px solid var(--border)}
.tfield:last-child{border-right:none}
.tbtn{
  width:100%;display:flex;flex-direction:column;align-items:center;
  padding:9px 4px 4px;border:none;background:transparent;cursor:pointer;
  font-family:var(--font);gap:2px;transition:background .1s
}
.tbtn:active{background:var(--surface2)}
.tbtn.on{background:var(--accent-soft)}
.tbtn-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.tbtn.on .tbtn-lbl{color:var(--ink2)}
.tbtn-val{font-size:14px;font-weight:700;color:var(--ink3);font-family:var(--mono)}
.tbtn.on .tbtn-val{color:var(--ink)}
.tedit{
  display:none;font-family:var(--font);font-size:10px;font-weight:700;
  color:var(--ink2);background:var(--accent-soft);
  border:1px solid var(--border2);border-radius:20px;padding:2px 8px;cursor:pointer
}
.tedit:active{background:var(--ink);color:#fff}

/* ── ADD STOP ── */
.btn-add{
  width:100%;padding:13px;
  background:transparent;
  border:1.5px dashed var(--border2);
  border-radius:var(--r);
  font-family:var(--font);font-size:14px;font-weight:600;
  color:var(--ink3);cursor:pointer;margin-bottom:10px;
  transition:all .2s
}
.btn-add:active{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}

/* ── REKAP TOTAL ── */
.rekap-card{
  background:var(--ink);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.15)
}
.rekap-title{
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.4);padding:12px 16px 6px
}
.rekap-grid{display:grid;grid-template-columns:repeat(3,1fr)}
.rk{padding:10px 12px 16px;text-align:center;border-right:1px solid rgba(255,255,255,.08)}
.rk:last-child{border-right:none}
.rk-num{font-size:28px;font-weight:700;color:#fff;font-family:var(--mono);line-height:1}
.rk-lbl{font-size:9px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.noted-wrap{padding:10px 16px;border-top:1px solid rgba(255,255,255,.08)}
.noted-inp{
  width:100%;font-family:var(--font);font-size:13px;
  color:rgba(255,255,255,.7);border:none;outline:none;
  background:transparent;resize:none
}
.noted-inp::placeholder{color:rgba(255,255,255,.2)}

/* ── CGKG SUMMARY (in rekap) ── */
.cgkg-sum{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-top:1px solid rgba(255,255,255,.08)
}
.cgkg-sum-lbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:rgba(134,239,172,.6);flex-shrink:0}
.cgkg-sum-vals{display:flex;gap:8px;flex-wrap:wrap}
.cgkg-chip{
  background:rgba(134,239,172,.1);border:1px solid rgba(134,239,172,.2);
  border-radius:20px;padding:3px 10px;
  font-size:11px;font-weight:700;color:#86efac;font-family:var(--mono)
}

/* ── BOTTOM BAR ── */
.bar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(245,244,241,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:10px 12px;
  display:flex;flex-direction:column;gap:6px;
  z-index:100;
  box-shadow:0 -4px 24px rgba(0,0,0,.08)
}
.bar-row{display:flex;gap:6px}
.btn-cgkg{
  flex:1;padding:13px;
  background:var(--cgkg);
  border:none;border-radius:10px;
  font-family:var(--font);font-size:13px;font-weight:700;
  color:#fff;cursor:pointer;
  box-shadow:0 4px 12px rgba(15,76,58,.3)
}
.btn-cgkg:active{opacity:.85}
.btn-wa{
  flex:2;padding:13px;
  background:var(--ink);
  border:none;border-radius:10px;
  font-family:var(--font);font-size:13px;font-weight:700;
  color:#fff;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.2)
}
.btn-wa:active{opacity:.85}
.bar-hint{
  font-size:10px;text-align:center;color:var(--ink3);
  font-family:var(--mono)
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:130px;left:50%;
  transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:#fff;
  padding:9px 18px;border-radius:20px;
  font-size:12px;font-weight:600;
  opacity:0;transition:all .25s;z-index:999;
  pointer-events:none;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.2)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MODAL ── */
.modal-ov{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  z-index:300;align-items:flex-end;justify-content:center
}
.modal-ov.open{display:flex}
.modal-box{
  background:var(--surface);border-radius:24px 24px 0 0;
  padding:20px 20px 32px;width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 -8px 40px rgba(0,0,0,.2)
}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin-bottom:4px}
.modal-lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3)}
.modal-inp{
  font-family:var(--mono);font-size:48px;font-weight:700;
  color:var(--ink);border:none;outline:none;
  text-align:center;background:transparent;width:100%;
  border-bottom:2px solid var(--border);padding-bottom:6px
}
.modal-btns{display:flex;gap:8px;width:100%;margin-top:4px}
.modal-cancel{
  flex:1;padding:14px;background:var(--surface2);
  border:1px solid var(--border);border-radius:12px;
  font-family:var(--font);font-size:14px;font-weight:700;
  color:var(--ink2);cursor:pointer
}
.modal-ok{
  flex:2;padding:14px;background:var(--ink);
  border:none;border-radius:12px;
  font-family:var(--font);font-size:14px;font-weight:700;
  color:#fff;cursor:pointer
}
.modal-ok:active{opacity:.85}
.modal-reset{
  background:none;border:none;color:var(--ink3);
  font-family:var(--font);font-size:12px;font-weight:600;
  cursor:pointer;padding:4px 8px;border-radius:6px
}
.modal-reset:active{color:var(--warn)}

/* ── REPORT PREVIEW MODAL ── */
.preview-ov{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  z-index:400;align-items:flex-end;justify-content:center
}
.preview-ov.open{display:flex}
.preview-box{
  background:var(--surface);border-radius:24px 24px 0 0;
  padding:20px 0 32px;width:100%;max-width:520px;
  max-height:85vh;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(0,0,0,.3)
}
.preview-hd{
  padding:0 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border)
}
.preview-title{font-size:15px;font-weight:700}
.preview-close{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:4px 12px;
  font-family:var(--font);font-size:12px;font-weight:600;
  color:var(--ink2);cursor:pointer
}
.preview-body{
  flex:1;overflow-y:auto;padding:16px 20px
}
.preview-text{
  font-family:var(--mono);font-size:12px;line-height:1.8;
  color:var(--ink);white-space:pre-wrap;
  background:var(--surface2);border-radius:12px;padding:16px;
  border:1px solid var(--border)
}
.preview-btns{
  display:flex;gap:8px;padding:12px 20px 0
}
.preview-copy{
  flex:1;padding:13px;background:var(--surface2);
  border:1px solid var(--border);border-radius:12px;
  font-family:var(--font);font-size:13px;font-weight:700;
  color:var(--ink2);cursor:pointer
}
.preview-wa{
  flex:2;padding:13px;background:var(--ink);
  border:none;border-radius:12px;
  font-family:var(--font);font-size:13px;font-weight:700;
  color:#fff;cursor:pointer
}
.preview-wa:active{opacity:.85}

/* TRIP COUNTER */
.trip-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border)}
.trip-col{padding:8px 14px;display:flex;align-items:center;gap:8px}
.trip-col:first-child{border-right:1px solid var(--border)}
.trip-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink3);flex:1}
.trip-ctrl{display:flex;align-items:center;gap:6px}
.trip-btn{
  width:24px;height:24px;border-radius:6px;
  background:var(--surface2);border:1px solid var(--border);
  font-size:16px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-family:var(--mono)
}
